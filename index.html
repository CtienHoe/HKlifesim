<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港人生模擬器 HK Life Sim Demo</title>
<style>
  :root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --accent: #ff9800;
    --text: #ffffff;
    --subtext: #aaaaaa;
  }
  body {
    background-color: var(--bg-color);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 450px;
    background-color: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  h1, h2, h3 { text-align: center; color: var(--accent); margin-top: 0; }
  .btn {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    background-color: var(--accent);
    color: #000;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { background-color: #555; color: #888; cursor: not-allowed; }
  .card {
    background: #2a2a2a;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .stat-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 0;
  }
  .bar-bg {
    width: 60%;
    background: #444;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; background: var(--accent); width: 50%; }
  .tab-group { display: flex; gap: 5px; margin-bottom: 15px; }
  .tab-btn { flex: 1; padding: 8px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: black; font-weight: bold; }
  .log-box {
    background: #111;
    border: 1px solid #333;
    padding: 10px;
    border-radius: 6px;
    height: 100px;
    overflow-y: auto;
    font-size: 13px;
    color: #ddd;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 頁面 1: 時代選擇 -->
  <div id="screen-era">
    <h1>香港人生模擬器</h1>
    <p style="text-align:center; color: var(--subtext);">請選擇一個年代開始：</p>
    <div class="card" onclick="selectEra('千禧年代')">
      <h3>千禧年代 (2004-2030)</h3>
      <p style="font-size:12px; color:var(--subtext);">港鐵成型、MSN時代、DSE改革。</p>
    </div>
    <div class="card" onclick="selectEra('黃金歲月')">
      <h3>黃金歲月 (1980年代)</h3>
      <p style="font-size:12px; color:var(--subtext);">股市狂熱、四大天王、經濟起飛。</p>
    </div>
  </div>

  <!-- 頁面 2: 命運抽獎 -->
  <div id="screen-lottery" style="display:none;">
    <h2>🎰 命運大抽獎</h2>
    <div class="card" id="lottery-result">
      <p>點擊下方按鈕抽取出身背景...</p>
    </div>
    <button class="btn" onclick="drawFate()">開始抽籤</button>
    <button class="btn" id="btn-start-game" onclick="startGame()" style="display:none;">進入人生</button>
  </div>

  <!-- 頁面 3: 主遊戲畫面 -->
  <div id="screen-game" style="display:none;">
    <div style="display:flex; justify-shadow:space-between; align-items:center;">
      <h3 id="player-age" style="margin:0;">Age 6 (小學一級)</h3>
      <span style="background:var(--accent); color:black; padding:2px 8px; border-radius:10px; font-weight:bold; font-size:12px;" id="ap-display">AP: 5/5</span>
    </div>
    <p style="font-size:12px; color:var(--subtext); margin: 4px 0 12px 0;" id="player-school">學校：深水埗官立小學</p>

    <!-- 屬性顯示 -->
    <div class="card">
      <div class="stat-bar"><span>❤️ 健康</span> <div class="bar-bg"><div id="bar-health" class="bar-fill"></div></div> <span id="val-health">50</span></div>
      <div class="stat-bar"><span>😊 快樂</span> <div class="bar-bg"><div id="bar-happy" class="bar-fill"></div></div> <span id="val-happy">50</span></div>
      <div class="stat-bar"><span>🧠 智力</span> <div class="bar-bg"><div id="bar-smarts" class="bar-fill"></div></div> <span id="val-smarts">50</span></div>
      <div class="stat-bar"><span>💰 儲蓄</span> <span id="val-money" style="color:#4caf50; font-weight:bold;">$100</span></div>
    </div>

    <!-- 事件 Console -->
    <div class="log-box" id="game-log">
      你出生了！準備展開你嘅香港人生。
    </div>

    <!-- 功能 Tab -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('action')">⚡ 行動</button>
      <button class="tab-btn" onclick="switchTab('rel')">👥 人際</button>
    </div>

    <!-- Tab 內容: 行動 -->
    <div id="tab-action">
      <div class="card">
        <b>📚 溫習功課 (1 AP)</b>
        <p style="font-size:11px; color:var(--subtext);">智力 +3 | 快樂 -1</p>
        <button class="btn" style="padding:5px;" onclick="doAction('study')">執行</button>
      </div>
      <div class="card">
        <b>🎮 打機放鬆 (1 AP)</b>
        <p style="font-size:11px; color:var(--subtext);">快樂 +3 | 智力 -1</p>
        <button class="btn" style="padding:5px;" onclick="doAction('play')">執行</button>
      </div>
    </div>

    <!-- Tab 內容: 人際關係 -->
    <div id="tab-rel" style="display:none;">
      <div class="card">
        <b>👩 媽媽 (張秀英) - 親密度: <span id="rel-mom">80</span>%</b>
        <p style="font-size:11px; color:var(--subtext);">職業：茶餐廳侍應</p>
        <button class="btn" style="padding:5px;" onclick="interactMom()">同媽媽傾偈 (1 AP)</button>
      </div>
    </div>

    <button class="btn" style="background:#4caf50; color:white; margin-top:15px;" onclick="nextYear()">下一年 (Age +1) ➡️</button>
  </div>
</div>

<script>
  // 遊戲狀態 (State)
  let player = {
    era: '',
    age: 6,
    ap: 5,
    maxAp: 5,
    health: 55,
    happy: 50,
    smarts: 45,
    money: 80,
    school: '深水埗官立小學',
    momRel: 70,
    district: '九龍',
    status: '基層家庭'
  };

  function selectEra(era) {
    player.era = era;
    document.getElementById('screen-era').style.display = 'none';
    document.getElementById('screen-lottery').style.display = 'block';
  }

  function drawFate() {
    const districts = ['九龍 (深水埗)', '新界 (屯門)', '港島 (灣仔)'];
    const statuses = ['基層家庭 (公屋)', '中產家庭 (私樓)', '富裕家庭 (豪宅)'];
    
    player.district = districts[Math.floor(Math.random() * districts.length)];
    player.status = statuses[Math.floor(Math.random() * statuses.length)];
    
    if(player.status.includes('富裕')) player.money = 5000;
    if(player.status.includes('中產')) player.money = 1000;

    document.getElementById('lottery-result').innerHTML = `
      <p><b>出生地區：</b>${player.district}</p>
      <p><b>家庭背景：</b>${player.status}</p>
      <p><b>初始資金：</b>HK$ ${player.money}</p>
    `;
    document.getElementById('btn-start-game').style.display = 'block';
  }

  function startGame() {
    document.getElementById('screen-lottery').style.display = 'none';
    document.getElementById('screen-game').style.display = 'block';
    updateUI();
  }

  function updateUI() {
    document.getElementById('player-age').innerText = `Age ${player.age} (${getGrade(player.age)})`;
    document.getElementById('ap-display').innerText = `AP: ${player.ap}/${player.maxAp}`;
    document.getElementById('player-school').innerText = `學校：${player.school}`;
    
    // UI 數值
    document.getElementById('val-health').innerText = player.health;
    document.getElementById('val-happy').innerText = player.happy;
    document.getElementById('val-smarts').innerText = player.smarts;
    document.getElementById('val-money').innerText = `$${player.money}`;
    document.getElementById('rel-mom').innerText = player.momRel;

    // Progress bar
    document.getElementById('bar-health').style.width = player.health + '%';
    document.getElementById('bar-happy').style.width = player.happy + '%';
    document.getElementById('bar-smarts').style.width = Math.min(player.smarts, 100) + '%';
  }

  function getGrade(age) {
    if (age <= 11) return `小學 ${age - 5} 年級`;
    if (age <= 17) return `中學 ${age - 11} 年級`;
    return '已畢業 / 社會人士';
  }

  function log(msg) {
    const logBox = document.getElementById('game-log');
    logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(tab === 'action') {
      document.getElementById('tab-action').style.display = 'block';
      document.getElementById('tab-rel').style.display = 'none';
      event.target.classList.add('active');
    } else {
      document.getElementById('tab-action').style.display = 'none';
      document.getElementById('tab-rel').style.display = 'block';
      event.target.classList.add('active');
    }
  }

  function doAction(type) {
    if (player.ap <= 0) { log('⚠️ 今日 AP 已經用完，請進入下一年！'); return; }
    
    player.ap -= 1;
    if (type === 'study') {
      player.smarts += 4;
      player.happy -= 1;
      log('📚 你認真溫習，智力 +4，快樂 -1');
    } else if (type === 'play') {
      player.happy += 4;
      player.smarts -= 1;
      log('🎮 你打咗一整晚機，快樂 +4，智力 -1');
    }
    updateUI();
  }

  function interactMom() {
    if (player.ap <= 0) { log('⚠️ 今日 AP 已經用完！'); return; }
    player.ap -= 1;
    player.momRel = Math.min(100, player.momRel + 5);
    player.happy += 2;
    log('👩 你同媽媽傾偈，媽媽俾咗你些少零用錢。親密度 +5，快樂 +2');
    updateUI();
  }

  // 升中學呈分試機制 (小六 12歲 TRIGGER)
  function checkExam() {
    if (player.age === 12) {
      log('📝 <b>【重點事件：升中呈分試】</b>');
      let chance = 0;
      if (player.smarts >= 80) chance = 99;
      else if (player.smarts >= 60) chance = 55;
      else chance = 15;

      let roll = Math.random() * 100;
      if (roll <= chance) {
        player.school = '拔萃男/女書院 (Band 1 名校)';
        log(`🎉 恭喜！憑住智力 (${player.smarts})，你成功考入 Band 1 名校：<b>${player.school}</b>！`);
      } else {
        player.school = '區內普通中學 (Band 2)';
        log(`🏫 呈分試結果出爐，你升讀：<b>${player.school}</b>。`);
      }
    }
  }

  function nextYear() {
    player.age += 1;
    player.ap = player.maxAp; // 重置 AP
    
    // 每年隨機事件
    log(`🗓️ 你升上了 ${player.age} 歲 (${getGrade(player.age)})`);
    
    // 檢查特徵事件 (例如 12 歲升中)
    checkExam();

    updateUI();
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港豪門與逆襲模擬器 HK Life Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { background-color: #0d1117; color: #e6edf3; font-family: 'Noto Sans TC', sans-serif; }
        .hk-gold { color: #f1c40f; text-shadow: 0 0 8px rgba(241, 196, 15, 0.4); }
        .hk-card { background: rgba(22, 27, 34, 0.85); border: 1px solid rgba(241, 196, 15, 0.2); backdrop-filter: blur(12px); }
        .neon-border { border-color: #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 md:p-6">

    <div id="app" class="w-full max-w-2xl hk-card rounded-2xl p-5 md:p-8 shadow-2xl border border-amber-500/30">
        
        <!-- 標題 -->
        <header class="text-center mb-6 border-b border-amber-500/20 pb-4">
            <h1 class="text-2xl md:text-4xl font-black hk-gold tracking-widest">🇭🇰 香港人生重開模擬器</h1>
            <p class="text-slate-400 text-xs md:text-sm mt-1">由公屋劏房到中環霸主 ‧ 逆天改命定係富二代躺平？</p>
        </header>

        <!-- 畫面 1: 輸入名字與首頁 -->
        <div id="screen-start" class="space-y-6">
            <div class="space-y-2">
                <label class="block text-sm font-bold text-amber-400">請輸入你嘅角色名字：</label>
                <input type="text" id="player-name-input" value="陳大文" placeholder="例如：張子豪 / 鄭大少" 
                       class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-amber-500 font-bold">
            </div>

            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 text-xs text-slate-400 leading-relaxed space-y-1">
                <p>💡 <b class="text-amber-400">天生屬性機制：</b> 採用正態分佈算法，大部分人屬性介乎 40-60，90 以上天才機率僅 1%。</p>
                <p>💡 <b class="text-amber-400">出身機率：</b> 50% 公屋起步，豪門世家僅得 3% 極低機率抽中！</p>
            </div>

            <button onclick="generateCharacter()" class="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg rounded-xl transition duration-200 shadow-lg shadow-amber-500/20">
                🎲 抽籤決定天命出身
            </button>
        </div>

        <!-- 畫面 2: 屬性展示與確定投胎 -->
        <div id="screen-setup" class="hidden space-y-6">
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                <h2 class="text-sm font-bold text-amber-400 mb-3 border-b border-slate-800 pb-2">📊 天生初始屬性 (可後天提升)</h2>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="bg-slate-800/50 p-2 rounded-lg">🧠 智力：<span id="attr-intel" class="font-bold text-white">0</span></div>
                    <div class="bg-slate-800/50 p-2 rounded-lg">💖 情商：<span id="attr-eq" class="font-bold text-white">0</span></div>
                    <div class="bg-slate-800/50 p-2 rounded-lg">✨ 外貌：<span id="attr-beauty" class="font-bold text-white">0</span></div>
                    <div class="bg-slate-800/50 p-2 rounded-lg">💪 體力：<span id="attr-phys" class="font-bold text-white">0</span></div>
                </div>
            </div>

            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                <h2 class="text-sm font-bold text-amber-400 mb-2">🏠 抽中出生背景</h2>
                <div id="origin-title" class="text-lg font-bold text-white mb-1">?</div>
                <p id="origin-desc" class="text-slate-400 text-xs mb-3">?</p>
                <div id="talent-tags" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="flex gap-3">
                <button onclick="generateCharacter()" class="w-1/2 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold border border-slate-700 transition">🎲 重新抽籤</button>
                <button onclick="startGame()" class="w-1/2 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl transition">🚀 投胎香港</button>
            </div>
        </div>

        <!-- 畫面 3: 遊戲主界面 -->
        <div id="screen-game" class="hidden space-y-5">
            <!-- 角色狀態面板 -->
            <div class="bg-slate-900 p-4 rounded-xl border border-amber-500/30">
                <div class="flex justify-between items-center mb-2 border-b border-slate-800 pb-2">
                    <span id="game-player-name" class="font-black text-amber-400 text-base">陳大文</span>
                    <span id="game-status" class="text-xs bg-amber-500/10 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded">公屋居民</span>
                </div>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <div>📅 年齡：<span id="game-age" class="text-white font-bold">0</span> 歲</div>
                    <div>💰 資產：<span id="game-money" class="text-emerald-400 font-bold">$0</span></div>
                    <div>🧠 智力：<span id="game-intel" class="text-slate-300 font-bold">0</span></div>
                    <div>💖 情商：<span id="game-eq" class="text-slate-300 font-bold">0</span></div>
                    <div>✨ 外貌：<span id="game-beauty" class="text-slate-300 font-bold">0</span></div>
                    <div>💪 體力：<span id="game-phys" class="text-slate-300 font-bold">0</span></div>
                </div>
            </div>

            <!-- 事件紀錄歷史 -->
            <div id="event-log" class="bg-slate-950 p-4 rounded-xl h-56 overflow-y-auto space-y-2.5 border border-slate-800 text-xs md:text-sm leading-relaxed">
            </div>

            <!-- 動態選項 -->
            <div id="choices-container" class="space-y-2.5">
            </div>
        </div>

    </div>

    <script>
        let player = {
            name: '陳大文',
            age: 0,
            intel: 0,
            eq: 0,
            beauty: 0,
            phys: 0,
            money: 0,
            origin: null,
            status: '基層市民'
        };

        // 地道香港出身機率分佈 (高機率基層，極低機率豪門)
        const origins = [
            { name: "深水埗劏房 / 借債家庭", prob: 0.05, baseMoney: 100, desc: "屋企環境極度狹窄，父母欠下一身債務，生活拮据。", status: "劏房居民" },
            { name: "黃大仙公共屋邨", prob: 0.50, baseMoney: 5000, desc: "典型的香港基層家庭，住公屋，父母做藍領辛苦拉扯你長大。", status: "公屋居民" },
            { name: "沙田居屋 / 夾屋家庭", prob: 0.30, baseMoney: 100000, desc: "小康家庭，父母係公務員或中小型公司小主管，衣食無憂。", status: "中產子弟" },
            { name: "太古城 / 港島私樓家庭", prob: 0.12, baseMoney: 1000000, desc: "優越中產家庭，住港島私樓，從小上名校兼學琴學畫。", status: "港島精英" },
            { name: "中環上市財閥 / 豪門世家", prob: 0.03, baseMoney: 50000000, desc: "極稀有！家族掌管上市地產或醫療集團，住山頂獨立屋。", status: "豪門少主" }
        ];

        // 高斯/正態分佈隨機數 (平均值 50，標準差 15) -> 產生 0-100 的天生屬性
        function randomGaussian() {
            let u = 0, v = 0;
            while(u === 0) u = Math.random();
            while(v === 0) v = Math.random();
            let num = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
            num = num / 10.0 + 0.5; // 移至 0.5 為中心
            if (num < 0 || num > 1) return randomGaussian(); // 超出範圍重抽
            return Math.floor(num * 100);
        }

        // 抽取背景
        function getRandomOrigin() {
            let rand = Math.random();
            let cumulative = 0;
            for (let origin of origins) {
                cumulative += origin.prob;
                if (rand <= cumulative) return origin;
            }
            return origins[1]; // 預設公屋
        }

        // 生成角色
        function generateCharacter() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            player.name = nameInput || "陳大文";

            player.intel = randomGaussian();
            player.eq = randomGaussian();
            player.beauty = randomGaussian();
            player.phys = randomGaussian();

            player.origin = getRandomOrigin();
            player.money = player.origin.baseMoney;
            player.status = player.origin.status;

            // UI 更新
            document.getElementById('attr-intel').innerText = player.intel;
            document.getElementById('attr-eq').innerText = player.eq;
            document.getElementById('attr-beauty').innerText = player.beauty;
            document.getElementById('attr-phys').innerText = player.phys;

            document.getElementById('origin-title').innerText = player.origin.name;
            document.getElementById('origin-desc').innerText = player.origin.desc;

            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-setup').classList.remove('hidden');
        }

        // 開始遊戲
        function startGame() {
            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');

            document.getElementById('game-player-name').innerText = player.name;
            logEvent(`👶 你喺香港出生，命名為【${player.name}】！出身於【${player.origin.name}】，初始啟動資金：HK$${player.money.toLocaleString()}`);
            
            nextTurn();
        }

        function logEvent(text) {
            const log = document.getElementById('event-log');
            log.innerHTML += `<p class="border-b border-slate-900 pb-1.5">${text}</p>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateUI() {
            document.getElementById('game-age').innerText = player.age;
            document.getElementById('game-money').innerText = 'HK$' + player.money.toLocaleString();
            document.getElementById('game-status').innerText = player.status;
            document.getElementById('game-intel').innerText = player.intel;
            document.getElementById('game-eq').innerText = player.eq;
            document.getElementById('game-beauty').innerText = player.beauty;
            document.getElementById('game-phys').innerText = player.phys;
        }

        // 核心遊戲流轉與香港地道事件
        function nextTurn() {
            player.age += 1;
            updateUI();

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            // 香港特有人生階段事件
            if (player.age === 6) {
                logEvent(`🎒 6 歲：到了升小學（小一派位）的時候...`);
                renderChoices([
                    { text: "🏫 參加小一面試，靠自己能力考名校", action: () => { 
                        if(player.intel > 60) { player.intel += 10; logEvent("你憑高智商順利考入拔萃/喇沙等名校！智力 +10"); }
                        else { logEvent("面試表現平平，派入普通津貼小學。"); }
                        nextTurn(); 
                    }},
                    { text: "⚽ 放學後跟屋邨小朋友去球場打波訓練體能", action: () => { player.phys += 8; logEvent("你體能大幅提升！體力 +8"); nextTurn(); } }
                ]);
            } 
            else if (player.age === 17) {
                logEvent(`📚 17 歲：面臨「香港中學文憑試 (DSE)」人生關口！`);
                renderChoices([
                    { text: "📖 狂補習夜讀，全力衝刺「狀元」榜眼", action: () => { 
                        player.intel += 15; 
                        logEvent("DSE 考獲 7 科 5**，成為狀元！考入港大 HKU 醫學/金融神科！智力 +15"); 
                        player.status = "神科學生";
                        nextTurn(); 
                    }},
                    { text: "💻 課餘時間研究 Coding 與 AI 技術", action: () => { 
                        player.intel += 10; player.money += 20000;
                        logEvent("你接 Freelance 寫網頁賺到了第一桶金 HK$20,000！"); 
                        nextTurn(); 
                    }},
                    { text: "🎨 放棄學業，專注社交與網絡創作者 (Sponsor)", action: () => { 
                        player.eq += 12; player.beauty += 5;
                        logEvent("你在 Instagram / YouTube 累積了第一批粉絲！情商 +12"); 
                        nextTurn(); 
                    }}
                ]);
            }
            else if (player.age === 23) {
                logEvent(`💼 23 歲：大學畢業踏入社會，迎接第一份工作！`);
                renderChoices([
                    { text: "🏢 進入中環投行 (IBank) / 4 大會計師樓做 Analyst", action: () => { 
                        player.money += 500000; player.status = "中環 Elite";
                        logEvent("年薪連 Bonus 達 50 萬！成為中環金融精英！"); nextTurn(); 
                    }},
                    { text: "🚀 在數碼港/科學園申請基金，創辦科技 Start-up", action: () => { 
                        if(player.intel > 70) {
                            player.money += 3000000; player.status = "創科 CEO";
                            logEvent("獲得 VC 融資 300 萬港幣！公司被收購！資產暴漲！"); 
                        } else {
                            player.money -= 50000;
                            logEvent("創業資金吃緊，暫時苦苦支撐。");
                        }
                        nextTurn(); 
                    }},
                    { text: "🏠 申請政府首置名額，咬牙炒樓買第一套私樓", action: () => { 
                        player.money = Math.floor(player.money * 1.5);
                        logEvent("地產升值！你賺到了第一筆地產收益！"); nextTurn(); 
                    }}
                ]);
            }
            else if (player.age === 30) {
                logEvent(`👑 30 歲：事業進入黃金爆發期！決定你的世紀決策：`);
                renderChoices([
                    { text: "💥 發動資本閃電戰，收購市面上所有科技競品強行獨大", action: () => { 
                        player.money *= 5; player.status = "香港商業巨鱷";
                        logEvent("成功吞併所有同類型公司！實現 100% 行業獨大！資產暴漲 5 倍！"); nextTurn(); 
                    }},
                    { text: "📈 炒港股 / 美股，集中資金做量化交易", action: () => { 
                        player.money *= 2.5; logEvent("量化模型大獲全勝！資產暴增！"); nextTurn(); 
                    }}
                ]);
            }
            else if (player.age === 38) {
                logEvent(`🏙️ 38 歲：你的資本已經富可敵國！決心建造「新香港」特別行政區：`);
                renderChoices([
                    { text: "🇭🇰 買地開發「新香港 (New HK)」超級科技特區", action: () => { 
                        player.money *= 8; player.status = "「新香港」Supreme Governor";
                        logEvent("世紀工程落成！全球精英爭相入住，你登頂為最高領袖！"); nextTurn(); 
                    }},
                    { text: "🚀 打造「太空天梯」與小行星採礦基地", action: () => { 
                        player.money *= 10; player.status = "星際領主";
                        logEvent("星際門戶開啟！個人資產衝破萬億港幣！登頂福布斯首富！"); nextTurn(); 
                    }}
                ]);
            }
            else {
                // 普通成長年份 (每 3 年一個階段)
                if(player.age > 40) {
                    logEvent(`🗓️ ${player.age} 歲：帝國版圖穩定擴張，後代與商業帝國順利傳承。`);
                } else {
                    logEvent(`🗓️ ${player.age} 歲：你在香港踏實奮鬥，能力與財富穩步積累。`);
                }
                
                renderChoices([
                    { text: "📈 繼續擴大商業投資，提升智力與財富", action: () => { 
                        player.intel += 2;
                        player.money = Math.floor(player.money * 1.2) + 50000; 
                        nextTurn(); 
                    }},
                    { text: "🏋️ 保持運動養生與社交，提升體能與情商", action: () => { 
                        player.phys += 3; player.eq += 3;
                        nextTurn(); 
                    }}
                ]);
            }
        }

        function renderChoices(options) {
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 bg-slate-900 hover:bg-amber-500/20 border border-slate-800 hover:border-amber-500/50 rounded-xl font-bold transition text-xs md:text-sm text-slate-200 flex items-center justify-between";
                btn.innerText = opt.text;
                btn.onclick = opt.action;
                choicesContainer.appendChild(btn);
            });
        }
    </script>
</body>
</html>

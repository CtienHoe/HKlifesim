<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Life Simulator (香港人生模擬器)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Noto Sans TC', sans-serif; user-select: none; }
        .gold-text { color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        .hk-card { background: rgba(20, 29, 47, 0.95); border: 1px solid rgba(245, 158, 11, 0.25); backdrop-filter: blur(16px); }
        .action-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.15); transition: all 0.15s ease; }
        .action-card:active { transform: scale(0.97); background: rgba(51, 65, 85, 0.9); }
        .tab-btn { transition: all 0.2s; color: #94a3b8; }
        .tab-btn.active { color: #f59e0b; font-weight: 900; border-top: 2px solid #f59e0b; background: rgba(245, 158, 11, 0.05); }
        .stat-bar { height: 6px; border-radius: 3px; transition: width 0.3s; }
        .npc-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 md:p-6 pb-24">

    <div id="app" class="w-full max-w-md md:max-w-xl hk-card rounded-2xl p-4 shadow-2xl min-h-[92vh] flex flex-col justify-between my-2 relative overflow-hidden">
        
        <!-- 頂部標題與核心數據 -->
        <header id="header-bar" class="hidden border-b border-slate-800 pb-3 space-y-2">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span id="ui-age" class="text-xl font-black text-amber-400">Age 0</span>
                    <span id="ui-status" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">幼童</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="ui-ap-badge" class="text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-full">⚡ 10/10 AP</span>
                    <span id="ui-money" class="text-sm font-black text-emerald-400">HK$0</span>
                </div>
            </div>

            <!-- 5 大核心屬性條 -->
            <div class="grid grid-cols-5 gap-1.5 text-[10px] text-slate-400 font-bold pt-1">
                <div>
                    <div class="flex justify-between"><span>Health</span><span id="val-health">100</span></div>
                    <div class="w-full bg-slate-800 rounded"><div id="bar-health" class="stat-bar bg-emerald-500" style="width: 100%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between"><span>Happy</span><span id="val-happy">80</span></div>
                    <div class="w-full bg-slate-800 rounded"><div id="bar-happy" class="stat-bar bg-amber-400" style="width: 80%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between"><span>IQ</span><span id="val-iq">100</span></div>
                    <div class="w-full bg-slate-800 rounded"><div id="bar-iq" class="stat-bar bg-blue-400" style="width: 70%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between"><span>Face</span><span id="val-face">50</span></div>
                    <div class="w-full bg-slate-800 rounded"><div id="bar-face" class="stat-bar bg-purple-400" style="width: 50%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between"><span>Stress</span><span id="val-stress">0</span></div>
                    <div class="w-full bg-slate-800 rounded"><div id="bar-stress" class="stat-bar bg-rose-500" style="width: 0%"></div></div>
                </div>
            </div>
            
            <div class="text-[11px] text-slate-400 flex justify-between border-t border-slate-800/60 pt-1.5 truncate">
                <span>📍 <span id="ui-district" class="text-amber-300">東區</span> (<span id="ui-estate">太古城</span>)</span>
                <span>🏫 <span id="ui-school" class="text-blue-300">未入學</span></span>
                <span>🏆 <span id="ui-rank" class="text-emerald-300">名次: --</span></span>
            </div>
        </header>

        <!-- 畫面 1：開局自訂 -->
        <div id="screen-start" class="space-y-5 my-auto">
            <div class="text-center">
                <h1 class="text-3xl font-black gold-text tracking-widest uppercase">🇭🇰 Hong Kong Life</h1>
                <p class="text-xs text-slate-400 mt-1">20+ 種高薪父母職場 ‧ 50+ 種在地事件 ‧ 10 AP 深度演繹</p>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-amber-400">主角姓名：</label>
                <input type="text" id="input-name" value="陳大文" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-bold text-sm">
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-amber-400">性別：</label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="setGender('男')" id="btn-m" class="p-3 bg-slate-800 border border-amber-500 rounded-xl text-amber-400 font-bold text-sm">👦 男</button>
                    <button onclick="setGender('女')" id="btn-f" class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-400 font-bold text-sm">👧 女</button>
                </div>
            </div>

            <button onclick="generateCharacter()" class="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base rounded-xl shadow-lg shadow-amber-500/20 transition">
                🎲 命運大抽獎：生成18區家境與基因
            </button>
        </div>

        <!-- 畫面 2：家境展示 -->
        <div id="screen-setup" class="hidden space-y-4 my-auto">
            <div class="text-center space-y-1">
                <div class="text-3xl">🎰</div>
                <h2 class="text-lg font-black text-amber-400">命運大抽獎結果</h2>
            </div>

            <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 space-y-3 text-xs">
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-400">出生地區：</span>
                    <span id="setup-district" class="font-bold text-amber-300">中西區</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-400">居住樓盤與階級：</span>
                    <span id="setup-estate" class="font-bold text-amber-300">山頂天比高 (隱世頂豪)</span>
                </div>
                <div class="space-y-2 pt-1">
                    <span class="text-slate-400 block font-bold">獨立 NPC 父母動態：</span>
                    <div id="setup-father" class="text-slate-300 bg-slate-800/50 p-2 rounded"></div>
                    <div id="setup-mother" class="text-slate-300 bg-slate-800/50 p-2 rounded"></div>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="generateCharacter()" class="w-1/2 py-3.5 bg-slate-800 text-slate-300 rounded-xl font-bold border border-slate-700 text-xs">🎲 重新抽籤</button>
                <button onclick="startGame()" class="w-1/2 py-3.5 bg-amber-500 text-slate-950 font-black rounded-xl text-xs">🚀 正式降生香港</button>
            </div>
        </div>

        <!-- 畫面 3：遊戲主區域 -->
        <div id="screen-main" class="hidden flex-grow flex flex-col justify-between overflow-hidden pb-14">
            
            <!-- 分頁內容容器 -->
            <div class="flex-grow overflow-y-auto pr-1 space-y-3 py-2" id="tab-content-area">
                
                <!-- TAB 1: 👦 育 (主頁面 / 故事日誌) -->
                <div id="view-育" class="space-y-3">
                    <div id="story-log-box" class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 text-xs leading-relaxed space-y-3 max-h-[48vh] overflow-y-auto"></div>
                </div>

                <!-- TAB 2: ⚡ 行動 (10 AP 分配) -->
                <div id="view-行動" class="hidden space-y-3">
                    <div class="flex border-b border-slate-800 text-xs font-bold gap-1 pb-2" id="action-subtabs">
                        <button onclick="switchActionSubTab('study')" id="subtab-study" class="px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded">📚 學習</button>
                        <button onclick="switchActionSubTab('play')" id="subtab-play" class="px-2.5 py-1 bg-slate-800 text-slate-400 rounded">🎮 娛樂</button>
                        <button onclick="switchActionSubTab('health')" id="subtab-health" class="px-2.5 py-1 bg-slate-800 text-slate-400 rounded">🏥 健康</button>
                        <button onclick="switchActionSubTab('work')" id="subtab-work" class="px-2.5 py-1 bg-slate-800 text-slate-400 rounded">💼 工作</button>
                    </div>

                    <div id="action-cards-list" class="space-y-2"></div>
                </div>

                <!-- TAB 3: 💼 職 (職場市場) -->
                <div id="view-職" class="hidden space-y-3 text-xs">
                    <h3 class="font-bold text-amber-400">💼 香港職場市場 (18歲解鎖)</h3>
                    <div id="job-market-list" class="space-y-2"></div>
                </div>

                <!-- TAB 4: 👥 人 (零 AP 免費人際互動) -->
                <div id="view-人" class="hidden space-y-3 text-xs">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-amber-400">👥 家庭與社交網絡</h3>
                        <span class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded">✨ 與家人互動免扣 AP！</span>
                    </div>
                    <div id="npc-relations-list" class="space-y-2"></div>
                </div>

                <!-- TAB 5: 🏠 房與資 (地產資產) -->
                <div id="view-資" class="hidden space-y-3 text-xs">
                    <h3 class="font-bold text-amber-400">🏠 樓盤地產與資產管理</h3>
                    <div id="estate-assets-list" class="space-y-2"></div>
                </div>

            </div>

            <!-- 懸浮推進下一年按鈕 (完全避免被 TabBar 擋住) -->
            <div class="p-2 border-t border-slate-800/80 bg-slate-900/95 rounded-xl flex justify-between items-center shrink-0 my-1">
                <span class="text-[10px] text-slate-400">10 AP 可多次分配行動</span>
                <button onclick="nextYear()" class="py-2.5 px-6 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm rounded-xl shadow-lg shadow-amber-500/20 transition">
                    下一年 ➔ (Age +1)
                </button>
            </div>

        </div>

        <!-- 底部 5 大導航 TabBar -->
        <nav id="bottom-tabbar" class="hidden absolute bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 grid grid-cols-5 text-center text-[10px] py-1.5 z-30">
            <button onclick="switchTab('育')" id="tab-育" class="tab-btn active py-1"><div>👦</div><div>育/主頁</div></button>
            <button onclick="switchTab('行動')" id="tab-行動" class="tab-btn py-1"><div>⚡</div><div>行動</div></button>
            <button onclick="switchTab('職')" id="tab-職" class="tab-btn py-1"><div>💼</div><div>職場</div></button>
            <button onclick="switchTab('人')" id="tab-人" class="tab-btn py-1"><div>👥</div><div>人際</div></button>
            <button onclick="switchTab('資')" id="tab-資" class="tab-btn py-1"><div>🏠</div><div>資產</div></button>
        </nav>

    </div>

    <script>
        let player = {
            name: "陳大文", gender: "男", age: 0, health: 100, happy: 80, iq: 100, face: 50, stress: 0,
            ap: 10, maxAp: 10, money: 0, origin: null, school: "未入學", schoolBandBonus: 0, classRank: 0,
            status: "幼兒", currentJob: "無", isHospitalized: false, actionsTakenThisYear: []
        };

        let npcs = [];

        // 巨量香港真實職場 Templates (高薪 + 高地位)
        const jobTemplates = {
            govHigh: [
                { title: "政務司 高級政務主任 (Senior AO)", inc: 185000, dept: "政府政務司", status: "權貴精英" },
                { title: "廉政公署 (ICAC) 高級調查主任", inc: 125000, dept: "ICAC", status: "核心中產" },
                { title: "金管局 (HKMA) 助理總裁", inc: 280000, dept: "金融管理局", status: "權貴精英" },
                { title: "警務處 高級警司", inc: 140000, dept: "警務處", status: "核心中產" }
            ],
            mncHigh: [
                { title: "跨國 IBank 董事總經理 (MD)", inc: 380000, dept: "企業融資部", status: "豪門財閥" },
                { title: "美資外企 亞太區首席技術官 (CTO)", inc: 320000, dept: "資訊科技部", status: "豪門財閥" },
                { title: "公立醫院 專科顧問醫生", inc: 220000, dept: "醫院管理局", status: "核心中產" },
                { title: "資深大律師 (Senior Counsel)", inc: 300000, dept: "法律界", status: "豪門財閥" },
                { title: "上市地產巨頭 投資總監", inc: 250000, dept: "地產發展", status: "豪門財閥" }
            ],
            mncMid: [
                { title: "外企科技公司 Senior Architect", inc: 85000, dept: "IT 部", status: "核心中產" },
                { title: "跨國銀行 合規經理 (Compliance)", inc: 90000, dept: "合規部", status: "核心中產" },
                { title: "中學副校長", inc: 95000, dept: "教育局校網", status: "核心中產" }
            ],
            smeLow: [
                { title: "中小企 總經理 (GM)", inc: 65000, dept: "管理層", status: "普通中產" },
                { title: "地盤工程項目項目主管", inc: 55000, dept: "建造業", status: "普通中產" },
                { title: "高級航空機師 (Captain)", inc: 160000, dept: "國泰航空", status: "核心中產" },
                { title: "連鎖餐廳店員經理", inc: 32000, dept: "餐飲服務", status: "基層公屋" }
            ]
        };

        const estates = [
            { name: "深水埗 劏房", district: "深水埗區", class: "基層貧民", prob: 0.10, fPool: jobTemplates.smeLow, mPool: jobTemplates.smeLow },
            { name: "天水圍 天晴邨", district: "元朗區", class: "基層公屋", prob: 0.20, fPool: jobTemplates.smeLow, mPool: jobTemplates.smeLow },
            { name: "黃大仙 下邨", district: "黃大仙區", class: "基層公屋", prob: 0.20, fPool: jobTemplates.smeLow, mPool: jobTemplates.smeLow },
            { name: "荔枝角 美孚新邨", district: "深水埗區", class: "普通中產", prob: 0.20, fPool: jobTemplates.govHigh, mPool: jobTemplates.mncMid },
            { name: "鰂魚涌 太古城", district: "東區", class: "核心中產", prob: 0.15, fPool: jobTemplates.mncMid, mPool: jobTemplates.govHigh },
            { name: "九龍站 凱旋門", district: "油尖旺區", class: "高端豪宅", prob: 0.08, fPool: jobTemplates.mncHigh, mPool: jobTemplates.govHigh },
            { name: "山頂 天比高", district: "中西區", class: "隱世頂豪", prob: 0.07, fPool: jobTemplates.mncHigh, mPool: jobTemplates.mncHigh }
        ];

        function setGender(g) {
            player.gender = g;
            document.getElementById('btn-m').className = g === '男' ? 'p-3 bg-slate-800 border border-amber-500 rounded-xl text-amber-400 font-bold text-sm' : 'p-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-400 font-bold text-sm';
            document.getElementById('btn-f').className = g === '女' ? 'p-3 bg-slate-800 border border-amber-500 rounded-xl text-amber-400 font-bold text-sm' : 'p-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-400 font-bold text-sm';
        }

        function generateCharacter() {
            player.name = document.getElementById('input-name').value.trim() || "陳大文";
            let rand = Math.random(), cum = 0;
            for (let e of estates) { cum += e.prob; if (rand <= cum) { player.origin = e; break; } }
            if (!player.origin) player.origin = estates[1];

            let fJob = player.origin.fPool[Math.floor(Math.random() * player.origin.fPool.length)];
            let mJob = player.origin.mPool[Math.floor(Math.random() * player.origin.mPool.length)];

            npcs = [
                { id: 'father', rel: '父親', name: "陳家豪", age: 36, job: fJob.title, inc: fJob.inc, iq: Math.round(fJob.inc > 100000 ? 122 : 98), face: 55, affinity: 85, status: fJob.status },
                { id: 'mother', rel: '母親', name: "王秀英", age: 34, job: mJob.title, inc: mJob.inc, iq: Math.round(mJob.inc > 100000 ? 122 : 98), face: 75, affinity: 88, status: mJob.status }
            ];

            player.iq = Math.round(((npcs[0].iq + npcs[1].iq) / 2) * 0.85 + (Math.random() * 20 - 5));

            document.getElementById('setup-district').innerText = player.origin.district;
            document.getElementById('setup-estate').innerText = `${player.origin.name} (${player.origin.class})`;
            document.getElementById('setup-father').innerText = `父親 ${npcs[0].name} (${npcs[0].age}歲)：💼 ${npcs[0].job} | 🏛️ ${npcs[0].status} | 💵 月薪 $${npcs[0].inc.toLocaleString()}`;
            document.getElementById('setup-mother').innerText = `母親 ${npcs[1].name} (${npcs[1].age}歲)：💼 ${npcs[1].job} | 🏛️ ${npcs[1].status} | 💵 月薪 $${npcs[1].inc.toLocaleString()}`;

            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-setup').classList.remove('hidden');
        }

        function startGame() {
            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
            document.getElementById('header-bar').classList.remove('hidden');
            document.getElementById('bottom-tabbar').classList.remove('hidden');

            appendLog(`【0歲 降生記】\n產房內傳來啼哭聲，你正式降生在香港${player.origin.district}！家庭階級為【${player.origin.class}】。\n父親擔任【${npcs[0].job}】 (${npcs[0].status})，每月收入 HK$${Math.round(npcs[0].inc).toLocaleString()}；母親擔任【${npcs[1].job}】 (${npcs[1].status})。\n經測試，你的天生 IQ 指數為 ${player.iq}（常態人口平均為 100）。一個屬於你的 Hong Kong Life Simulator 傳奇故事，在此拉開序幕……`);
            updateUI();
            renderActionCards('study');
            renderNPCs();
        }

        function appendLog(text) {
            const box = document.getElementById('story-log-box');
            box.innerHTML += `<div class="p-3 bg-slate-900 rounded border border-slate-800">${text.replace(/\n/g, '<br>')}</div>`;
            setTimeout(() => box.scrollTop = box.scrollHeight, 50);
        }

        function calcRank() {
            if (player.age < 6 || player.age >= 18) return "--";
            let diff = player.iq - 105;
            let base = 60 - (diff * 2.2) - (player.actionsTakenThisYear.filter(a => a.includes('溫習') || a.includes('圖書館')).length * 3);
            player.classRank = Math.max(1, Math.min(120, Math.round(base + (Math.random() * 6 - 3))));
            return `第 ${player.classRank} / 120 名`;
        }

        function updateUI() {
            player.health = Math.max(0, Math.min(100, player.health));
            player.happy = Math.max(0, Math.min(100, player.happy));
            player.face = Math.max(0, Math.min(100, player.face));
            player.stress = Math.max(0, Math.min(100, player.stress));

            document.getElementById('ui-age').innerText = `Age ${player.age}`;
            document.getElementById('ui-status').innerText = player.age < 6 ? "幼童" : (player.age < 18 ? "學生" : "成年人");
            document.getElementById('ui-ap-badge').innerText = `⚡ ${player.ap}/${player.maxAp} AP`;
            document.getElementById('ui-money').innerText = `HK$${player.money.toLocaleString()}`;

            document.getElementById('val-health').innerText = player.health;
            document.getElementById('val-happy').innerText = player.happy;
            document.getElementById('val-iq').innerText = player.iq;
            document.getElementById('val-face').innerText = player.face;
            document.getElementById('val-stress').innerText = player.stress;

            document.getElementById('bar-health').style.width = player.health + '%';
            document.getElementById('bar-happy').style.width = player.happy + '%';
            document.getElementById('bar-iq').style.width = Math.min(100, (player.iq / 150) * 100) + '%';
            document.getElementById('bar-face').style.width = player.face + '%';
            document.getElementById('bar-stress').style.width = player.stress + '%';

            document.getElementById('ui-district').innerText = player.origin.district;
            document.getElementById('ui-estate').innerText = player.origin.name;
            document.getElementById('ui-school').innerText = player.school;
            document.getElementById('ui-rank').innerText = `名次: ${calcRank()}`;
        }

        function switchTab(tabName) {
            ['育', '行動', '職', '人', '資'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active');
            });
            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        function switchActionSubTab(sub) {
            ['study', 'play', 'health', 'work'].forEach(s => {
                let btn = document.getElementById(`subtab-${s}`);
                if (btn) btn.className = s === sub ? 'px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded' : 'px-2.5 py-1 bg-slate-800 text-slate-400 rounded';
            });
            renderActionCards(sub);
        }

        // 行動 AP 卡片庫
        const actionCardsData = {
            study: [
                { title: "溫習功課", desc: "狂操 Past Paper 試卷，提升成績名次", cost: 1, effect: () => { player.iq += 1; player.happy -= 2; player.stress += 3; }, tag: "+1 IQ, -2 快, +3 壓" },
                { title: "去圖書館溫書", desc: "圖書館環境專注，備考效率高", cost: 1, effect: () => { player.iq += 1; player.happy -= 1; player.stress += 2; }, tag: "+1 IQ, -1 快, +2 壓" },
                { title: "閱讀科普圖書", desc: "純粹享受閱讀樂趣，拓寬視野", cost: 1, effect: () => { player.iq += 1; player.happy += 2; }, tag: "+1 IQ, +2 快" },
                { title: "報讀線上精英課程", desc: "補習名師高階培訓", cost: 2, effect: () => { player.iq += 3; player.stress += 4; player.money = Math.max(0, player.money - 2000); }, tag: "+3 IQ, -$2,000" }
            ],
            play: [
                { title: "同朋友去玩", desc: "放鬆心情，建立社交朋友圈", cost: 1, effect: () => { player.happy += 3; player.health -= 2; player.money = Math.max(0, player.money - 40); }, tag: "+3 快, -2 康, -$40" },
                { title: "落街場打籃球", desc: "勤力清潔波鞋鞋底，保持狀態", cost: 1, effect: () => { player.health += 4; player.happy += 2; player.stress = Math.max(0, player.stress - 3); }, tag: "+4 康, +2 快, -3 壓" },
                { title: "一家人去飲茶", desc: "增進家庭感情與溫馨回憶", cost: 1, effect: () => { player.happy += 4; player.health -= 2; player.money = Math.max(0, player.money - 200); }, tag: "+4 快, -2 康, -$200" }
            ],
            health: [
                { title: "休息一陣", desc: "坐在一旁聽音樂，減壓抒懷", cost: 1, effect: () => { player.stress = Math.max(0, player.stress - 4); player.health += 2; }, tag: "-4 壓, +2 康" },
                { title: "出去跑步健身", desc: "出汗鍛鍊，提高體能與外貌", cost: 1, effect: () => { player.health += 3; player.face += 1; player.stress = Math.max(0, player.stress - 2); }, tag: "+3 康, +1 顏, -2 壓" }
            ],
            work: [
                { title: "兼職私人補習", desc: "幫中小學生補習賺取零用錢", cost: 1, effect: () => { player.money += 4000; player.stress += 5; }, tag: "+$4,000, +5 壓" }
            ]
        };

        function renderActionCards(subCat) {
            const list = document.getElementById('action-cards-list');
            list.innerHTML = '';
            let cards = actionCardsData[subCat] || [];

            cards.forEach(c => {
                list.innerHTML += `
                    <div onclick="doAction('${c.title}')" class="action-card p-3 rounded-xl flex justify-between items-center cursor-pointer">
                        <div>
                            <div class="font-bold text-sm text-white flex items-center gap-2">
                                ${c.title}
                                <span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.5 rounded">⚡ ${c.cost} AP</span>
                            </div>
                            <div class="text-xs text-slate-400 mt-0.5">${c.desc}</div>
                        </div>
                        <div class="text-xs font-bold text-amber-400 shrink-0 ml-2">${c.tag}</div>
                    </div>`;
            });
        }

        function doAction(title) {
            if (player.ap <= 0) { alert("本年度 10 AP 已用完！請點擊『下一年』推進！"); return; }
            let all = [...actionCardsData.study, ...actionCardsData.play, ...actionCardsData.health, ...actionCardsData.work];
            let card = all.find(c => c.title === title);
            if (card) {
                if (player.ap < card.cost) { alert("AP 不足！"); return; }
                player.ap -= card.cost;
                card.effect();
                player.actionsTakenThisYear.push(card.title);
                updateUI();
                appendLog(`⚡ 執行【${card.title}】：${card.tag} (剩餘 AP: ${player.ap})`);
            }
        }

        // 人際關係列表（零 AP 免費溝通）
        function renderNPCs() {
            const list = document.getElementById('npc-relations-list');
            list.innerHTML = '';
            npcs.forEach(n => {
                list.innerHTML += `
                    <div class="npc-card p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <div class="font-bold text-amber-300">${n.rel}: ${n.name} (${n.age}歲)</div>
                            <div class="text-slate-400">💼 ${n.job} | 🏛️ ${n.status}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-emerald-400">${n.affinity}% 親密</div>
                            <button onclick="interactNpc('${n.name}')" class="mt-1 px-2.5 py-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded text-[10px]">傾偈 (免費 0 AP)</button>
                        </div>
                    </div>`;
            });
        }

        function interactNpc(name) {
            let n = npcs.find(x => x.name === name);
            if (n) {
                n.affinity = Math.min(100, n.affinity + 5);
                player.happy += 3;
                updateUI();
                renderNPCs();
                appendLog(`💬 (0 AP) 與 ${n.rel} ${n.name} 傾偈心靈溝通，親密值上升至 ${n.affinity}%！快樂 +3！`);
            }
        }

        function nextYear() {
            if (player.isHospitalized) {
                player.isHospitalized = false;
                player.health = 60;
                player.stress = 20;
                player.ap = 10;
                appendLog(`🏥 【康復出院】休養一年後身體已無大礙，AP 恢復至 10。請謹記勞逸結合！`);
                player.age++;
                updateUI();
                return;
            }

            if (player.stress >= 100 || player.health <= 0) {
                player.isHospitalized = true;
                player.money = Math.max(0, player.money - 30000);
                appendLog(`⚠️【嚴重警告：過勞中風/抑鬱住院！】你的壓力爆表 (≥100) 或健康歸零！你被緊急送院，扣減 HK$30,000 醫療費！下一年強制休養！`);
                player.age++;
                updateUI();
                return;
            }

            player.age++;
            player.ap = player.maxAp;

            // 父母職場演化
            npcs.forEach(n => { n.age++; if (Math.random() < 0.25) { n.inc = Math.round(n.inc * 1.06); } });

            // 深度年度故事演繹邏輯
            let story = `【${player.age}歲 演繹推斷】\n這一年你在【${player.origin.name} (${player.origin.district})】度過。`;
            
            if (player.actionsTakenThisYear.length > 0) {
                story += ` 你將 10 AP 行動力投入在：${[...new Set(player.actionsTakenThisYear)].join('、')}。`;
            } else {
                story += ` 你選擇了放空擺爛，沒有消耗任何 AP。`;
            }

            // 升學與事件關卡
            if (player.age === 6) {
                if (Math.random() < 0.3 || player.iq > 120) {
                    player.school = "拔萃附屬小學 (Band 1A名校)";
                    story += `\n🎉 6歲名校面試結果：你憑藉優異天資通過拔萃面試，成功入讀【${player.school}】！父母為你感到無比自豪！`;
                } else {
                    player.school = `${player.origin.district}地區官立小學`;
                    story += `\n🎲 6歲大抽獎結果：名校競爭激烈，你被順利派入【${player.school}】！`;
                }
            } else if (player.age === 12) {
                player.school = "拔萃男/女書院 (Band 1A中學)";
                story += `\n🏫 中一升學呈分試放榜：你憑藉小學累積的名次，成功考入【${player.school}】！`;
            } else if (player.age === 18) {
                player.school = "香港大學 (HKU) 醫學/金融系";
                player.status = "大學生";
                story += `\n🎓 DSE 放榜時刻：你成功考獲高分，榮登狀元行列，順利錄取【${player.school}】！正式告別中學生涯！`;
            } else if (player.age > 18 && player.school.includes("小學")) {
                player.school = "香港大學 (HKU) 金融系";
                player.status = "專業精英";
            }

            if (player.age >= 6 && player.age < 18) {
                story += `\n🏆 年終考試放榜：你的學業總成績排名為【${calcRank()}】。`;
            }

            player.actionsTakenThisYear = []; // 清空年度紀錄
            appendLog(story);
            updateUI();
            renderNPCs();
        }
    </script>
</body>
</html>
